<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="The Desk — a calm, private daily organizer for tasks, appointments and the people behind them." />
<title>The Desk — a personal organizer</title>
<style>
  /* ============================================================
     TOKENS — palette, type, spacing, radii
     Concept: a tidy studio desk. Warm putty ground, ink-dark text,
     one confident accent (deep teal) for actions, and four semantic
     colors that carry real meaning: overdue (clay), today (amber),
     upcoming (slate), done (moss).
     ============================================================ */
  :root {
    --bg: #ede7db;
    --surface: #faf7ef;
    --surface-2: #f2ecdf;
    --ink: #241f1a;
    --ink-soft: #6e6656;
    --ink-faint: #948c79;
    --line: #dcd3bf;
    --line-strong: #c7bca2;

    --accent: #16665f;
    --accent-strong: #0f4d47;
    --accent-ink: #fbfaf6;
    --accent-soft: #dceae6;

    --amber: #9c5f1e;
    --amber-soft: #f3e3cc;
    --clay: #a23a26;
    --clay-soft: #f5ded8;
    --moss: #3f6b3d;
    --moss-soft: #e1ebdd;
    --slate: #2f4c68;
    --slate-soft: #dce6ee;

    --shadow-sm: 0 1px 2px rgba(36, 31, 26, 0.09);
    --shadow-md: 0 4px 16px rgba(36, 31, 26, 0.12);

    --radius: 8px;
    --radius-sm: 5px;

    --font-display: ui-serif, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Seravek", "Gill Sans Nova", "Segoe UI", Ubuntu, Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1712;
      --surface: #221d17;
      --surface-2: #29231b;
      --ink: #efe8da;
      --ink-soft: #b3a891;
      --ink-faint: #7d7461;
      --line: #382f23;
      --line-strong: #4a3f2f;

      --accent: #4fbbae;
      --accent-strong: #7ad4c8;
      --accent-ink: #0c221f;
      --accent-soft: #1e3733;

      --amber: #e0a25c;
      --amber-soft: #392a17;
      --clay: #e2705a;
      --clay-soft: #3a2019;
      --moss: #8fbe86;
      --moss-soft: #22301e;
      --slate: #86add1;
      --slate-soft: #1e2c3a;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1712;
    --surface: #221d17;
    --surface-2: #29231b;
    --ink: #efe8da;
    --ink-soft: #b3a891;
    --ink-faint: #7d7461;
    --line: #382f23;
    --line-strong: #4a3f2f;

    --accent: #4fbbae;
    --accent-strong: #7ad4c8;
    --accent-ink: #0c221f;
    --accent-soft: #1e3733;

    --amber: #e0a25c;
    --amber-soft: #392a17;
    --clay: #e2705a;
    --clay-soft: #3a2019;
    --moss: #8fbe86;
    --moss-soft: #22301e;
    --slate: #86add1;
    --slate-soft: #1e2c3a;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
  }

  /* ============================================================ base ============================================================ */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  ::selection { background: var(--accent-soft); color: var(--accent-strong); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ============================================================ app shell ============================================================ */
  .app {
    display: flex;
    min-height: 100vh;
  }

  .rail {
    width: 232px;
    flex-shrink: 0;
    background: var(--surface-2);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 22px 16px;
    gap: 28px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  .brand svg { flex-shrink: 0; color: var(--accent); }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-name { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
  .brand-tag { font-size: 0.7rem; color: var(--ink-faint); letter-spacing: 0.02em; }

  .tabs { display: flex; flex-direction: column; gap: 3px; }
  .tab {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-size: 0.9rem;
    color: var(--ink-soft);
    transition: background 0.12s ease, color 0.12s ease;
  }
  .tab svg { flex-shrink: 0; opacity: 0.8; }
  .tab:hover { background: var(--surface); color: var(--ink); }
  .tab.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .tab.active svg { opacity: 1; }
  .tab .count {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    background: rgba(0,0,0,0.08);
    padding: 1px 6px;
    border-radius: 999px;
  }
  .tab.active .count { background: rgba(255,255,255,0.22); }

  .rail-footer { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }

  .ghost-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-align: left;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }

  .main {
    flex: 1;
    min-width: 0;
    padding: 28px 40px 60px;
    max-width: 980px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    margin-bottom: 4px;
  }
  .page-date { font-size: 1.7rem; }
  .status-line { font-size: 0.9rem; color: var(--ink-soft); max-width: 320px; text-align: right; }

  .view { display: flex; flex-direction: column; gap: 26px; }
  .view[hidden] { display: none; }

  section.block { display: flex; flex-direction: column; gap: 12px; }
  .block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .block-title { font-size: 1.05rem; }
  .block-hint { font-size: 0.8rem; color: var(--ink-faint); }

  /* ============================================================ stat tiles ============================================================ */
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--tint, var(--line-strong));
    border-radius: var(--radius-sm);
    padding: 12px 14px;
  }
  .stat-tile .stat-num { font-family: var(--font-mono); font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat-tile .stat-label { font-size: 0.76rem; color: var(--ink-soft); margin-top: 5px; }
  .stat-tile.clay { --tint: var(--clay); }
  .stat-tile.amber { --tint: var(--amber); }
  .stat-tile.slate { --tint: var(--slate); }
  .stat-tile.moss { --tint: var(--moss); }

  /* ============================================================ cards / lists ============================================================ */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }

  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }
  .item.is-done { opacity: 0.6; }
  .item.is-done .item-title { text-decoration: line-through; text-decoration-color: var(--ink-faint); }

  .check {
    flex-shrink: 0;
    width: 21px; height: 21px;
    border-radius: 5px;
    border: 1.5px solid var(--line-strong);
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    color: transparent;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .check:hover { border-color: var(--accent); }
  .item.is-done .check { background: var(--moss); border-color: var(--moss); color: var(--accent-ink); }

  .item-body { flex: 1; min-width: 0; }
  .item-title { font-size: 0.92rem; font-weight: 500; }
  .item-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 3px; font-size: 0.76rem; color: var(--ink-soft); }
  .item-meta .num { color: var(--ink-soft); }
  .item-notes { font-size: 0.8rem; color: var(--ink-faint); margin-top: 3px; }

  .item-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm);
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint);
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
  .icon-btn.danger:hover { color: var(--clay); }

  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.01em;
    padding: 2px 8px; border-radius: 999px;
    white-space: nowrap;
  }
  .chip.clay { background: var(--clay-soft); color: var(--clay); }
  .chip.amber { background: var(--amber-soft); color: var(--amber); }
  .chip.slate { background: var(--slate-soft); color: var(--slate); }
  .chip.moss { background: var(--moss-soft); color: var(--moss); }
  .chip.neutral { background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line); }

  .empty {
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
    padding: 22px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.86rem;
  }

  .nudge {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--amber-soft);
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 14px 16px;
    color: var(--ink);
  }
  .nudge svg { color: var(--amber); flex-shrink: 0; margin-top: 2px; }
  .nudge strong { display: block; margin-bottom: 2px; }
  .nudge p { font-size: 0.85rem; color: var(--ink-soft); }

  /* ============================================================ forms ============================================================ */
  .form-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .form-title { font-size: 0.95rem; margin-bottom: 12px; }
  .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
  .form-grid.people-grid { grid-template-columns: 1.3fr 1fr 1fr; }
  .form-grid.appt-grid { grid-template-columns: 1.6fr 1fr 0.9fr 0.7fr; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.span-full { grid-column: 1 / -1; }
  .field label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); }
  .field input, .field select, .field textarea {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-size: 0.88rem;
    color: var(--ink);
    width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 38px; }
  .form-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 10px; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--accent); color: var(--accent-ink);
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 0.85rem; font-weight: 600;
  }
  .btn:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn.secondary { background: transparent; color: var(--ink-soft); border-color: var(--line-strong); }
  .btn.secondary:hover { color: var(--ink); border-color: var(--ink-faint); background: var(--surface-2); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-chip {
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; font-size: 0.78rem; color: var(--ink-soft);
  }
  .filter-chip:hover { border-color: var(--accent); }
  .filter-chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

  /* ============================================================ people ============================================================ */
  .people-grid-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .person-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .person-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .person-name { font-size: 0.95rem; font-weight: 600; }
  .person-role { font-size: 0.76rem; color: var(--accent); margin-top: 2px; }
  .person-meta { font-size: 0.8rem; color: var(--ink-soft); }
  .person-notes { font-size: 0.78rem; color: var(--ink-faint); }
  .person-foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 6px; border-top: 1px solid var(--line); }

  /* ============================================================ toasts ============================================================ */
  .toast-stack { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
  .toast {
    background: var(--ink); color: var(--surface);
    padding: 10px 16px; border-radius: var(--radius-sm);
    font-size: 0.82rem; box-shadow: var(--shadow-md);
    animation: toast-in 0.16s ease-out;
  }
  :root[data-theme="dark"] .toast, @media (prefers-color-scheme: dark) { }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ============================================================ responsive ============================================================ */
  @media (max-width: 860px) {
    .main { padding: 20px 20px 60px; max-width: none; }
    .form-grid, .form-grid.people-grid, .form-grid.appt-grid { grid-template-columns: 1fr 1fr; }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 680px) {
    .app { flex-direction: column; }
    .rail {
      width: auto; flex-direction: row; align-items: center;
      padding: 12px 14px; gap: 14px; overflow-x: auto;
      border-right: none; border-bottom: 1px solid var(--line);
    }
    .brand-tag { display: none; }
    .tabs { flex-direction: row; }
    .tab .count { display: none; }
    .rail-footer { margin-top: 0; flex-direction: row; }
    .ghost-btn span.long { display: none; }
    .topbar { align-items: flex-start; }
    .status-line { text-align: left; max-width: none; }
    .form-grid, .form-grid.people-grid, .form-grid.appt-grid { grid-template-columns: 1fr; }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <aside class="rail">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <rect x="3" y="7" width="14" height="16" rx="1.5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
          <rect x="7" y="4" width="14" height="16" rx="1.5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
          <rect x="11" y="1" width="14" height="16" rx="1.5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">The Desk</span>
          <span class="brand-tag">for the wonderfully scattered</span>
        </div>
      </div>

      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab active" data-view="dashboard" role="tab" aria-selected="true">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="8.5" y="1.5" width="6" height="9" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="1.5" y="9.5" width="6" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
          Dashboard
        </button>
        <button class="tab" data-view="tasks" role="tab" aria-selected="false">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 4.5l1.3 1.3L6 3.5M2.5 9.5l1.3 1.3L6 8.5M2.5 14.5l1.3 1.3L6 13.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 4.5h6M8 9.5h6M8 14.5h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          Tasks
          <span class="count" id="navCountTasks">0</span>
        </button>
        <button class="tab" data-view="appointments" role="tab" aria-selected="false">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6h13M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          Appointments
          <span class="count" id="navCountAppts">0</span>
        </button>
        <button class="tab" data-view="people" role="tab" aria-selected="false">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="6" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 14c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="12" cy="5" r="1.8" stroke="currentColor" stroke-width="1.2"/><path d="M10.8 10.3c1.9.2 3.2 1.5 3.2 3.7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          People
        </button>
      </nav>

      <div class="rail-footer">
        <button class="ghost-btn" id="exportBtn" type="button">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.5v9M4.5 7l3.5 3.5L11.5 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12.5v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span class="long">Export backup</span>
        </button>
        <label class="ghost-btn" for="importFile">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 10.5v-9M4.5 5l3.5-3.5L11.5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12.5v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span class="long">Import backup</span>
        </label>
        <input type="file" id="importFile" accept="application/json" hidden />
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="greeting">Good morning</p>
          <h1 class="page-date" id="pageDate">—</h1>
        </div>
        <p class="status-line" id="statusLine">—</p>
      </header>

      <!-- ============================== DASHBOARD ============================== -->
      <section class="view" id="view-dashboard" data-view="dashboard">
        <div class="stat-row">
          <div class="stat-tile clay">
            <div class="stat-num num" id="statOverdue">0</div>
            <div class="stat-label">Overdue</div>
          </div>
          <div class="stat-tile amber">
            <div class="stat-num num" id="statToday">0</div>
            <div class="stat-label">Due today</div>
          </div>
          <div class="stat-tile slate">
            <div class="stat-num num" id="statWeek">0</div>
            <div class="stat-label">This week</div>
          </div>
          <div class="stat-tile moss">
            <div class="stat-num num" id="statOpen">0</div>
            <div class="stat-label">Open tasks</div>
          </div>
        </div>

        <div id="nudgeSlot"></div>

        <section class="block">

      <!-- ============================== TASKS ============================== -->

            <div class="field">
              <label for="taskCategory">Repeats</label>
              <select id="taskCategory">
                <option value="oneoff">One-off (pick a date)</option>

      <section class="view" id="view-people" data-view="people" hidden>
        <form class="form-card" id="personForm">
          <p class="form-title" id="personFormTitle">Add a person</p>
          <div class="form-grid people-grid">
            <div class="field">
              <label for="personName">Name</label>
              <input type="text" id="personName" placeholder="e.g. Alex Rivera" required maxlength="80" />

            <button class="btn" type="submit" id="personSubmitBtn">Add person</button>

        <section class="block">

    </main>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script>
  (function () {
    'use strict';

    /* ============================================================
       CONSTANTS & SMALL HELPERS
       ============================================================ */
    var STORAGE_KEY = 'the-desk.v1';

    var uid = function () {
      return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    };
    var todayISO = function () {
      var d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    };
    var isoOf = function (date) {
      var d = new Date(date);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    };
    var addDaysISO = function (n) {
      var d = new Date();
      d.setDate(d.getDate() + n);
      return isoOf(d);
    };
    var dayOfWeek = function (iso) { return new Date(iso + 'T00:00:00').getDay(); };
    var isWeekendISO = function (iso) { var d = dayOfWeek(iso); return d === 0 || d === 6; };
    var daysBetween = function (aISO, bISO) {
      var a = new Date(aISO + 'T00:00:00');
      var b = new Date(bISO + 'T00:00:00');
      return Math.round((b - a) / 86400000);
    };
    var formatDateLong = function (iso) {
      return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    };
    var formatDateShort = function (iso) {
      return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    };
    var formatTime = function (hhmm) {
      if (!hhmm) return '';
      var parts = hhmm.split(':');
      var h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
      var period = h >= 12 ? 'PM' : 'AM';
      var h12 = ((h + 11) % 12) + 1;
      return h12 + ':' + (m < 10 ? '0' + m : m) + ' ' + period;
    };
    var esc = function (s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    };
    var pluralize = function (n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); };

    var ICON = {
      trash: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3a1 1 0 011-1h1a1 1 0 011 1v1.5M4.5 4.5l.6 8a1 1 0 001 .9h3.8a1 1 0 001-.9l.6-8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      edit: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11 2l3 3-8 8-3.5 1 1-3.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>',
      check: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      alert: '<svg width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.5l7 12.5H1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 6.2v3.3M8 11.6v.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'
    };

    /* ============================================================
       SEED DATA — shown only on a first-ever visit so the app never
       opens to a blank, uninviting screen.
       ============================================================ */
    function seedData() {
      var barberId = uid();
      return {
        people: [
          { id: barberId, name: 'Alex Rivera', role: 'Barber', phone: '', notes: 'Example contact — edit or delete me.' }
        ],
        appointments: [
          { id: uid(), title: 'Haircut', personId: barberId, date: addDaysISO(9), time: '10:30', location: '', notes: 'Example — edit or delete me.', reminderDays: 2, createdAt: Date.now() }
        ],
        tasks: [
          { id: uid(), title: "Check tomorrow's calendar", notes: '', category: 'weekday', dueDate: null, completedDates: [], createdAt: Date.now() },
          { id: uid(), title: 'Meal-prep for the week', notes: '', category: 'weekend', dueDate: null, completedDates: [], createdAt: Date.now() },
          { id: uid(), title: 'Book a dentist check-up', notes: 'Example — edit or delete me.', category: 'oneoff', dueDate: addDaysISO(3), completedDates: [], createdAt: Date.now() }
        ]
      };
    }

    /* ============================================================
       PERSISTENCE
       ============================================================ */
    function persist(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
    function loadState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          parsed.people = parsed.people || [];
          parsed.tasks = parsed.tasks || [];
          parsed.appointments = parsed.appointments || [];
          return parsed;
        }
      } catch (e) { console.warn('The Desk: could not read saved data, starting fresh.', e); }
      var seed = seedData();
      persist(seed);
      return seed;
    }

    var state = loadState();
    function save() { persist(state); }

    /* ============================================================
       TASK LOGIC
       ============================================================ */
    function isScheduledToday(task) {
      var t = todayISO();
      if (task.category === 'daily') return true;
      if (task.category === 'weekday') return !isWeekendISO(t);
      if (task.category === 'weekend') return isWeekendISO(t);
      if (task.category === 'oneoff') return task.dueDate === t;
      return false;
    }
    function relevantDate(task) { return task.category === 'oneoff' ? task.dueDate : todayISO(); }
    function isDoneToday(task) {
      var rel = relevantDate(task);
      return !!rel && task.completedDates.indexOf(rel) !== -1;
    }
    function isOverdue(task) {
      if (task.category !== 'oneoff' || !task.dueDate) return false;
      var t = todayISO();
      return task.dueDate < t && task.completedDates.indexOf(task.dueDate) === -1;
    }
    function toggleTask(id) {
      var task = state.tasks.filter(function (x) { return x.id === id; })[0];
      if (!task) return;
      var rel = relevantDate(task);
      if (!rel) return;
      var idx = task.completedDates.indexOf(rel);
      if (idx >= 0) task.completedDates.splice(idx, 1);
      else task.completedDates.push(rel);
      save();
      renderAll();
    }
    function currentStreak(task) {
      if (task.category === 'oneoff') return 0;
      var streak = 0;
      var cursor = new Date();
      var t = todayISO();
      if (task.completedDates.indexOf(t) === -1) cursor.setDate(cursor.getDate() - 1);
      for (var i = 0; i < 366; i++) {
        var iso = isoOf(cursor);
        var scheduled = task.category === 'daily' ? true : (task.category === 'weekday' ? !isWeekendISO(iso) : isWeekendISO(iso));
        if (scheduled) {
          if (task.completedDates.indexOf(iso) !== -1) { streak++; cursor.setDate(cursor.getDate() - 1); }
          else break;
        } else {
          cursor.setDate(cursor.getDate() - 1);
        }
      }
      return streak;
    }
    function categoryLabel(cat) {
      return { daily: 'Every day', weekday: 'Weekdays', weekend: 'Weekends', oneoff: 'One-off' }[cat] || cat;
    }

    /* ============================================================
       VIEW SWITCHING
       ============================================================ */
    var currentView = 'dashboard';
    function showView(name) {
      currentView = name;
      document.querySelectorAll('.view').forEach(function (el) {
        el.hidden = el.dataset.view !== name;
      });
      document.querySelectorAll('.tab').forEach(function (el) {
        var active = el.dataset.view === name;
        el.classList.toggle('active', active);
        el.setAttribute('aria-selected', active ? 'true' : 'false');
      });
    }

    /* ============================================================
       TOASTS
       ============================================================ */
    function toast(msg) {
      var stack = document.getElementById('toastStack');
      var el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      stack.appendChild(el);
      setTimeout(function () {
        el.style.transition = 'opacity .2s ease';
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 220);
      }, 2200);
    }

    /* ============================================================
       HEADER
       ============================================================ */
    function renderHeader() {
      var hour = new Date().getHours();
      var greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
      document.getElementById('greeting').textContent = greeting;
      document.getElementById('pageDate').textContent = formatDateLong(todayISO());

      var overdue = state.tasks.filter(isOverdue).length +
        state.appointments.filter(function (a) { return a.date < todayISO(); }).length;
      var dueToday = state.tasks.filter(function (t) { return isScheduledToday(t) && !isDoneToday(t); }).length;
      var apptToday = state.appointments.filter(function (a) { return a.date === todayISO(); }).length;

      var line;
      if (overdue > 0) line = pluralize(overdue, 'thing') + ' overdue — let’s clear those first.';
      else if (dueToday + apptToday > 0) line = pluralize(dueToday + apptToday, 'thing') + ' on deck for today.';
      else line = 'Nothing due today. Enjoy the quiet.';
      document.getElementById('statusLine').textContent = line;
    }

    /* ============================================================
       DASHBOARD
       ============================================================ */
    function renderDashboard() {
      var t = todayISO();
      var overdueTasks = state.tasks.filter(isOverdue);
      var overdueAppts = state.appointments.filter(function (a) { return a.date < t; });
      var todayTasks = state.tasks.filter(function (x) { return isScheduledToday(x) && !isDoneToday(x); });
      var todayAppts = state.appointments.filter(function (a) { return a.date === t; });
      var weekAppts = state.appointments.filter(function (a) { return a.date > t && daysBetween(t, a.date) <= 7; });
      var openTasks = state.tasks.filter(function (x) { return isScheduledToday(x) && !isDoneToday(x); }).length +
        state.tasks.filter(function (x) { return x.category === 'oneoff' && x.dueDate && x.dueDate > t && daysBetween(t, x.dueDate) <= 30 && x.completedDates.indexOf(x.dueDate) === -1; }).length;

      document.getElementById('statOverdue').textContent = overdueTasks.length + overdueAppts.length;
      document.getElementById('statToday').textContent = todayTasks.length + todayAppts.length;
      document.getElementById('statWeek').textContent = weekAppts.length;
      document.getElementById('statOpen').textContent = openTasks;

      // Needs attention
      var attentionHtml = '';
      overdueAppts.concat(overdueTasks).forEach(function (x) {
        attentionHtml += x.title !== undefined && x.category !== undefined
          ? taskRow(x)
          : apptRow(x);
      });
      todayTasks.forEach(function (x) { attentionHtml += taskRow(x); });
      todayAppts.forEach(function (x) { attentionHtml += apptRow(x); });
      document.getElementById('listAttention').innerHTML = attentionHtml ||
        '<div class="empty">Nothing needs attention right now — you’re caught up.</div>';

      // This week
      var weekHtml = '';
      weekAppts.sort(function (a, b) { return a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''); })
        .forEach(function (x) { weekHtml += apptRow(x); });
      document.getElementById('listWeek').innerHTML = weekHtml ||
        '<div class="empty">No appointments in the next 7 days.</div>';

      // Weekend nudge — surfaces Thu/Fri so weekend plans don't get forgotten
      var dow = dayOfWeek(t);
      var weekendTasks = state.tasks.filter(function (x) { return x.category === 'weekend'; });
      var nudgeSlot = document.getElementById('nudgeSlot');
      if ((dow === 4 || dow === 5) && weekendTasks.length) {
        nudgeSlot.innerHTML =
          '<div class="nudge">' + ICON.alert +
          '<div><strong>The weekend is close.</strong>' +
          '<p>' + esc(weekendTasks.map(function (x) { return x.title; }).join(', ')) + '</p></div></div>';
      } else {
        nudgeSlot.innerHTML = '';
      }
    }

    function taskRow(task) {
      var overdue = isOverdue(task);
      var chip = overdue
        ? '<span class="chip clay">Overdue · ' + esc(formatDateShort(task.dueDate)) + '</span>'
        : '<span class="chip amber">' + esc(categoryLabel(task.category)) + '</span>';
      var streak = currentStreak(task);
      var streakBadge = streak > 1 ? '<span class="chip neutral num">' + streak + '-day streak</span>' : '';
      var done = isDoneToday(task);
      return '<div class="item' + (done ? ' is-done' : '') + '" data-kind="task" data-id="' + task.id + '">' +
        '<button class="check" data-action="toggle-task" data-id="' + task.id + '" aria-label="Mark done">' + ICON.check + '</button>' +
        '<div class="item-body"><div class="item-title">' + esc(task.title) + '</div>' +
        '<div class="item-meta">' + chip + streakBadge + '</div>' +
        (task.notes ? '<div class="item-notes">' + esc(task.notes) + '</div>' : '') +
        '</div>' +
        '<div class="item-actions">' +
        '<button class="icon-btn" data-action="edit-task" data-id="' + task.id + '" aria-label="Edit">' + ICON.edit + '</button>' +
        '<button class="icon-btn danger" data-action="delete-task" data-id="' + task.id + '" aria-label="Delete">' + ICON.trash + '</button>' +
        '</div></div>';
    }

    function apptRow(appt) {
      var t = todayISO();
      var statusChip;
      if (appt.date < t) statusChip = '<span class="chip clay">Past</span>';
      else if (appt.date === t) statusChip = '<span class="chip amber">Today</span>';
      else statusChip = '<span class="chip slate">In ' + pluralize(daysBetween(t, appt.date), 'day') + '</span>';
      var person = appt.personId ? state.people.filter(function (p) { return p.id === appt.personId; })[0] : null;
      var meta = [esc(formatDateShort(appt.date))];
      if (appt.time) meta.push(esc(formatTime(appt.time)));
      if (person) meta.push('with ' + esc(person.name));
      if (appt.location) meta.push(esc(appt.location));
      return '<div class="item" data-kind="appt" data-id="' + appt.id + '">' +
        '<div class="item-body"><div class="item-title">' + esc(appt.title) + '</div>' +
        '<div class="item-meta">' + statusChip + '<span>' + meta.join(' · ') + '</span></div>' +
        (appt.notes ? '<div class="item-notes">' + esc(appt.notes) + '</div>' : '') +
        '</div>' +
        '<div class="item-actions">' +
        '<button class="icon-btn" data-action="edit-appt" data-id="' + appt.id + '" aria-label="Edit">' + ICON.edit + '</button>' +
        '<button class="icon-btn danger" data-action="delete-appt" data-id="' + appt.id + '" aria-label="Delete">' + ICON.trash + '</button>' +
        '</div></div>';
    }

    /* ============================================================
       TASKS VIEW
       ============================================================ */
    var taskFilter = 'all';
    var editingTaskId = null;

    function taskMatchesFilter(task, filter) {
      var t = todayISO();
      switch (filter) {
        case 'today': return isScheduledToday(task);
        case 'week':
          if (task.category !== 'oneoff') return true;
          return task.dueDate && task.dueDate >= t && daysBetween(t, task.dueDate) <= 7;
        case 'weekend':
          if (task.category === 'weekend') return true;
          if (task.category === 'oneoff') return task.dueDate && isWeekendISO(task.dueDate) && task.dueDate >= t;
          return false;
        case 'overdue': return isOverdue(task);
        case 'done': return isDoneToday(task);
        default: return true;
      }
    }

    function renderTasks() {
      document.querySelectorAll('#taskFilters .filter-chip').forEach(function (b) {
        b.classList.toggle('active', b.dataset.filter === taskFilter);
      });
      var items = state.tasks.filter(function (t) { return taskMatchesFilter(t, taskFilter); });
      items.sort(function (a, b) {
        var ao = isOverdue(a) ? 0 : 1, bo = isOverdue(b) ? 0 : 1;
        if (ao !== bo) return ao - bo;
        return (b.createdAt || 0) - (a.createdAt || 0);
      });
      document.getElementById('listTasks').innerHTML = items.length
        ? items.map(taskRow).join('')
        : '<div class="empty">No tasks in this view yet.</div>';

      document.getElementById('navCountTasks').textContent =
        state.tasks.filter(function (x) { return isScheduledToday(x) && !isDoneToday(x); }).length;
    }

    /* ============================================================
       APPOINTMENTS VIEW
       ============================================================ */
    var editingApptId = null;

    function refreshPersonSelect() {
      var sel = document.getElementById('apptPerson');
      var current = sel.value;
      sel.innerHTML = '<option value="">— No one in particular —</option>' +
        state.people.map(function (p) { return '<option value="' + p.id + '">' + esc(p.name) + (p.role ? ' · ' + esc(p.role) : '') + '</option>'; }).join('');
      sel.value = current;
    }

    function renderAppointments() {
      refreshPersonSelect();
      var t = todayISO();
      var upcoming = state.appointments.filter(function (a) { return a.date >= t; })
        .sort(function (a, b) { return a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''); });
      var past = state.appointments.filter(function (a) { return a.date < t; })
        .sort(function (a, b) { return b.date.localeCompare(a.date); });

      document.getElementById('listApptUpcoming').innerHTML = upcoming.length
        ? upcoming.map(apptRow).join('')
        : '<div class="empty">No upcoming appointments. Add one above.</div>';

      document.getElementById('pastApptBlock').hidden = past.length === 0;
      document.getElementById('listApptPast').innerHTML = past.map(apptRow).join('');

      document.getElementById('navCountAppts').textContent = upcoming.filter(function (a) { return a.date === t; }).length;
    }

    /* ============================================================
       PEOPLE VIEW
       ============================================================ */
    var editingPersonId = null;

    function renderPeople() {
      var html = state.people.map(function (p) {
        var apptCount = state.appointments.filter(function (a) { return a.personId === p.id && a.date >= todayISO(); }).length;
        return '<div class="person-card" data-id="' + p.id + '">' +
          '<div class="person-top"><div><div class="person-name">' + esc(p.name) + '</div>' +
          (p.role ? '<div class="person-role">' + esc(p.role) + '</div>' : '') + '</div>' +
          '<div class="item-actions">' +
          '<button class="icon-btn" data-action="edit-person" data-id="' + p.id + '" aria-label="Edit">' + ICON.edit + '</button>' +
          '<button class="icon-btn danger" data-action="delete-person" data-id="' + p.id + '" aria-label="Delete">' + ICON.trash + '</button>' +
          '</div></div>' +
          (p.phone ? '<div class="person-meta">' + esc(p.phone) + '</div>' : '') +
          (p.notes ? '<div class="person-notes">' + esc(p.notes) + '</div>' : '') +
          '<div class="person-foot"><span class="chip slate">' + pluralize(apptCount, 'upcoming appt') + '</span></div>' +
          '</div>';
      }).join('');
      document.getElementById('listPeople').innerHTML = html ||
        '<div class="empty">No one here yet. Add the people behind your appointments — your barber, dentist, doctor…</div>';
    }

    /* ============================================================
       RENDER ALL
       ============================================================ */
    function renderAll() {
      renderHeader();
      renderDashboard();
      renderTasks();
      renderAppointments();
      renderPeople();
    }

    /* ============================================================
       EVENTS — tabs
       ============================================================ */
    document.querySelectorAll('.tab').forEach(function (btn) {
      btn.addEventListener('click', function () { showView(btn.dataset.view); });
    });

    /* ---- task form ---- */
    var taskCategoryEl = document.getElementById('taskCategory');
    var taskDateField = document.getElementById('taskDateField');
    function syncTaskDateField() { taskDateField.style.display = taskCategoryEl.value === 'oneoff' ? '' : 'none'; }
    taskCategoryEl.addEventListener('change', syncTaskDateField);
    syncTaskDateField();

    document.getElementById('taskForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = document.getElementById('taskTitle').value.trim();
      if (!title) return;
      var category = taskCategoryEl.value;
      var dueDate = document.getElementById('taskDate').value || (category === 'oneoff' ? todayISO() : null);
      var notes = document.getElementById('taskNotes').value.trim();

      if (editingTaskId) {
        var t = state.tasks.filter(function (x) { return x.id === editingTaskId; })[0];
        if (t) { t.title = title; t.category = category; t.dueDate = category === 'oneoff' ? dueDate : null; t.notes = notes; }
        toast('Task updated');
      } else {
        state.tasks.push({ id: uid(), title: title, category: category, dueDate: category === 'oneoff' ? dueDate : null, notes: notes, completedDates: [], createdAt: Date.now() });
        toast('Task added');
      }
      save();
      resetTaskForm();
      renderAll();
    });
    document.getElementById('taskCancelEdit').addEventListener('click', resetTaskForm);
    function resetTaskForm() {
      editingTaskId = null;
      document.getElementById('taskForm').reset();
      syncTaskDateField();
      document.getElementById('taskFormTitle').textContent = 'Add a task';
      document.getElementById('taskSubmitBtn').textContent = 'Add task';
      document.getElementById('taskCancelEdit').hidden = true;
    }

    /* ---- appointment form ---- */
    document.getElementById('apptForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = document.getElementById('apptTitle').value.trim();
      var date = document.getElementById('apptDate').value;
      if (!title || !date) return;
      var payload = {
        title: title,
        personId: document.getElementById('apptPerson').value || null,
        date: date,
        time: document.getElementById('apptTime').value || '',
        location: document.getElementById('apptLocation').value.trim(),
        reminderDays: parseInt(document.getElementById('apptReminder').value, 10) || 0,
        notes: document.getElementById('apptNotes').value.trim()
      };
      if (editingApptId) {
        var a = state.appointments.filter(function (x) { return x.id === editingApptId; })[0];
        if (a) Object.assign(a, payload);
        toast('Appointment updated');
      } else {
        payload.id = uid(); payload.createdAt = Date.now();
        state.appointments.push(payload);
        toast('Appointment added');
      }
      save();
      resetApptForm();
      renderAll();
    });
    document.getElementById('apptCancelEdit').addEventListener('click', resetApptForm);
    function resetApptForm() {
      editingApptId = null;
      document.getElementById('apptForm').reset();
      document.getElementById('apptReminder').value = 1;
      document.getElementById('apptFormTitle').textContent = 'Add an appointment';
      document.getElementById('apptSubmitBtn').textContent = 'Add appointment';
      document.getElementById('apptCancelEdit').hidden = true;
    }

    /* ---- person form ---- */
    document.getElementById('personForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = document.getElementById('personName').value.trim();
      if (!name) return;
      var payload = {
        name: name,
        role: document.getElementById('personRole').value.trim(),
        phone: document.getElementById('personPhone').value.trim(),
        notes: document.getElementById('personNotes').value.trim()
      };
      if (editingPersonId) {
        var p = state.people.filter(function (x) { return x.id === editingPersonId; })[0];
        if (p) Object.assign(p, payload);
        toast('Person updated');
      } else {
        payload.id = uid();
        state.people.push(payload);
        toast('Person added');
      }
      save();
      resetPersonForm();
      renderAll();
    });
    document.getElementById('personCancelEdit').addEventListener('click', resetPersonForm);
    function resetPersonForm() {
      editingPersonId = null;
      document.getElementById('personForm').reset();
      document.getElementById('personFormTitle').textContent = 'Add a person';
      document.getElementById('personSubmitBtn').textContent = 'Add person';
      document.getElementById('personCancelEdit').hidden = true;
    }

    /* ---- quick add (dashboard) ---- */
    document.getElementById('quickAddForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = document.getElementById('qaTitle').value.trim();
      if (!title) return;
      var category = document.getElementById('qaCategory').value;
      state.tasks.push({ id: uid(), title: title, category: category, dueDate: category === 'oneoff' ? todayISO() : null, notes: '', completedDates: [], createdAt: Date.now() });
      save();
      document.getElementById('quickAddForm').reset();
      toast('Task added');
      renderAll();
    });

    /* ---- filter chips ---- */
    document.getElementById('taskFilters').addEventListener('click', function (e) {
      var btn = e.target.closest('.filter-chip');
      if (!btn) return;
      taskFilter = btn.dataset.filter;
      renderTasks();
    });

    /* ---- delegated row actions ---- */
    document.getElementById('app').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      var id = btn.dataset.id;
      var action = btn.dataset.action;

      if (action === 'toggle-task') { toggleTask(id); return; }

      if (action === 'edit-task') {
        var t = state.tasks.filter(function (x) { return x.id === id; })[0];
        if (!t) return;
        editingTaskId = id;
        showView('tasks');
        document.getElementById('taskTitle').value = t.title;
        taskCategoryEl.value = t.category;
        syncTaskDateField();
        document.getElementById('taskDate').value = t.dueDate || '';
        document.getElementById('taskNotes').value = t.notes || '';
        document.getElementById('taskFormTitle').textContent = 'Edit task';
        document.getElementById('taskSubmitBtn').textContent = 'Save changes';
        document.getElementById('taskCancelEdit').hidden = false;
        document.getElementById('taskTitle').focus();
        return;
      }
      if (action === 'delete-task') {
        var task = state.tasks.filter(function (x) { return x.id === id; })[0];
        if (task && confirm('Delete "' + task.title + '"?')) {
          state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
          save(); toast('Task deleted'); renderAll();
        }
        return;
      }

      if (action === 'edit-appt') {
        var a = state.appointments.filter(function (x) { return x.id === id; })[0];
        if (!a) return;
        editingApptId = id;
        showView('appointments');
        document.getElementById('apptTitle').value = a.title;
        refreshPersonSelect();
        document.getElementById('apptPerson').value = a.personId || '';
        document.getElementById('apptDate').value = a.date;
        document.getElementById('apptTime').value = a.time || '';
        document.getElementById('apptLocation').value = a.location || '';
        document.getElementById('apptReminder').value = a.reminderDays != null ? a.reminderDays : 1;
        document.getElementById('apptNotes').value = a.notes || '';
        document.getElementById('apptFormTitle').textContent = 'Edit appointment';
        document.getElementById('apptSubmitBtn').textContent = 'Save changes';
        document.getElementById('apptCancelEdit').hidden = false;
        document.getElementById('apptTitle').focus();
        return;
      }
      if (action === 'delete-appt') {
        var appt = state.appointments.filter(function (x) { return x.id === id; })[0];
        if (appt && confirm('Delete "' + appt.title + '"?')) {
          state.appointments = state.appointments.filter(function (x) { return x.id !== id; });
          save(); toast('Appointment deleted'); renderAll();
        }
        return;
      }

      if (action === 'edit-person') {
        var p = state.people.filter(function (x) { return x.id === id; })[0];
        if (!p) return;
        editingPersonId = id;
        showView('people');
        document.getElementById('personName').value = p.name;
        document.getElementById('personRole').value = p.role || '';
        document.getElementById('personPhone').value = p.phone || '';
        document.getElementById('personNotes').value = p.notes || '';
        document.getElementById('personFormTitle').textContent = 'Edit person';
        document.getElementById('personSubmitBtn').textContent = 'Save changes';
        document.getElementById('personCancelEdit').hidden = false;
        document.getElementById('personName').focus();
        return;
      }
      if (action === 'delete-person') {
        var person = state.people.filter(function (x) { return x.id === id; })[0];
        if (person && confirm('Delete "' + person.name + '"? Their appointments will stay, just unlinked.')) {
          state.people = state.people.filter(function (x) { return x.id !== id; });
          state.appointments.forEach(function (a) { if (a.personId === id) a.personId = null; });
          save(); toast('Person deleted'); renderAll();
        }
        return;
      }
    });

    /* ---- export / import ---- */
    document.getElementById('exportBtn').addEventListener('click', function () {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'the-desk-backup-' + todayISO() + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast('Backup downloaded');
    });

    document.getElementById('importFile').addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          if (!data || typeof data !== 'object') throw new Error('bad shape');
          state = {
            people: Array.isArray(data.people) ? data.people : [],
            tasks: Array.isArray(data.tasks) ? data.tasks : [],
            appointments: Array.isArray(data.appointments) ? data.appointments : []
          };
          state.tasks.forEach(function (t) { if (!Array.isArray(t.completedDates)) t.completedDates = []; });
          save();
          renderAll();
          toast('Backup imported');
        } catch (err) {
          alert('That file doesn’t look like a valid The Desk backup.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    /* ============================================================
       INIT
       ============================================================ */
    showView('dashboard');
    renderAll();
    // Keep "today" accurate if the app is left open across midnight.
    setInterval(renderAll, 5 * 60 * 1000);
  })();
  </script>
</body>
</html>
